<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <!-- Inline icon: no favicon request (SPEC §1.2: the RPC is the only default request). -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%23171717%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-family=%22system-ui%22 font-size=%2216%22 font-weight=%22700%22 text-anchor=%22middle%22 fill=%22white%22%3EPS%3C/text%3E%3C/svg%3E" />
    <title>SafeDesk | Safe Management</title>
    <!-- The splash covers the page until the app has loaded its settings (app.tsx removes it), so a
         slow load isn't a blank page. Scoped to #splash; colors and sizes match the header and
         src/index.css. "Loading…" appears only if loading takes a moment. -->
    <style>
      #splash { position: fixed; inset: 0; background: oklch(1 0 0); color: oklch(0.145 0 0); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", Arial, sans-serif; line-height: 1.5; }
      #splash .bar { border-bottom: 1px solid oklch(0.922 0 0); }
      #splash .name { box-sizing: border-box; display: flex; align-items: center; height: 3.5rem; max-width: 56rem; margin: 0 auto; padding: 0 1rem; font-weight: 600; letter-spacing: 0; }
      #splash .note { box-sizing: border-box; max-width: 42rem; margin: 0 auto; padding: 2rem 1rem; color: oklch(0.556 0 0); opacity: 0; animation: splash-show 0s 400ms forwards; }
      @keyframes splash-show { to { opacity: 1; } }
      @media (prefers-color-scheme: dark) {
        #splash { background: oklch(0.145 0 0); color: oklch(0.985 0 0); }
        #splash .bar { border-color: oklch(1 0 0 / 10%); }
        #splash .note { color: oklch(0.708 0 0); }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-busy="true">
      <div class="bar"><p class="name">SafeDesk</p></div>
      <p class="note">Loading…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
